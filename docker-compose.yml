services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    volumes:
      # persists the trained MNIST checkpoints across restarts and rebuilds,
      # so training happens once (on the first run) rather than every build
      - mnist-models:/app/models

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE: http://localhost:8000
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  mnist-models:
